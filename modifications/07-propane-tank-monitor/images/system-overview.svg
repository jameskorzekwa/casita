<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Propane tank monitor system overview</title>
  <desc id="desc">Two DYP L06 ultrasonic sensors are held by a magnetic collar against the centre of the domed bottom of each 20 pound propane cylinder on the trailer tongue, inside the foot ring. Each sensor's four-wire cable runs through the front wall to a XIAO ESP32-S3 inside the trailer. The ESP32 is powered from a fused 12 volt circuit through a 5 volt buck regulator and supplies 3.3 volts to both sensors. Every minute it wakes each sensor over its own serial UART, reads the liquid height, temperature, echo strength and tilt, and publishes propane percentage and pounds remaining to Home Assistant over Wi-Fi. A local web page on the ESP32 shows the same readings.</desc>
  <defs>
    <style>
      .box{fill:#f5f7fa;stroke:#243b53;stroke-width:3}
      .tank{fill:#fff3c4;stroke:#b44d12;stroke-width:3}
      .dev{fill:#e3f8ff;stroke:#186faf;stroke-width:3}
      .ha{fill:#e6fffa;stroke:#0f766e;stroke-width:3}
      .sensor{fill:#243b53}
      .liquid{fill:#bde0fe}
      .t{font:600 18px system-ui,sans-serif;fill:#102a43}
      .s{font:14px system-ui,sans-serif;fill:#334e68}
      .w{fill:none;stroke-width:4}
      .pos{stroke:#c53030}
      .neg{stroke:#243b53}
      .data{stroke:#7b2cbf}
      .wifi{stroke:#0f766e;stroke-dasharray:10 8}
      .wall{stroke:#829ab1;stroke-width:3;stroke-dasharray:10 8}
    </style>
  </defs>
  <rect width="1100" height="560" rx="24" fill="#fff"/>
  <text class="t" x="40" y="40">Propane tank monitor: DYP L06 sensors, XIAO ESP32-S3, Home Assistant</text>

  <!-- Tongue area -->
  <text class="s" x="40" y="78">Tongue, under the tank cover</text>

  <!-- Tank 1 -->
  <path class="tank" d="M70 110 h110 a14 14 0 0 1 14 14 v170 a62 24 0 0 1 -138 0 v-170 a14 14 0 0 1 14 -14 z"/>
  <path class="liquid" d="M62 220 h126 v74 a62 24 0 0 1 -126 0 z"/>
  <rect class="sensor" x="110" y="318" width="30" height="8" rx="2"/>
  <path class="w neg" d="M62 326 h126" stroke-width="3"/>
  <text class="t" x="125" y="170" text-anchor="middle">Tank 1</text>
  <text class="s" x="125" y="192" text-anchor="middle">20 lb cylinder</text>
  <text class="s" x="125" y="350" text-anchor="middle">L06 sensor in a</text>
  <text class="s" x="125" y="368" text-anchor="middle">magnetic collar</text>

  <!-- Tank 2 -->
  <path class="tank" d="M250 110 h110 a14 14 0 0 1 14 14 v170 a62 24 0 0 1 -138 0 v-170 a14 14 0 0 1 14 -14 z"/>
  <path class="liquid" d="M242 260 h126 v34 a62 24 0 0 1 -126 0 z"/>
  <rect class="sensor" x="290" y="318" width="30" height="8" rx="2"/>
  <path class="w neg" d="M242 326 h126" stroke-width="3"/>
  <text class="t" x="305" y="170" text-anchor="middle">Tank 2</text>
  <text class="s" x="305" y="192" text-anchor="middle">20 lb cylinder</text>

  <!-- Sensor cables to the ESP32 -->
  <path class="w data" d="M140 322 H210 V420 H520"/>
  <path class="w data" d="M320 322 H345 V440 H520"/>
  <text class="s" x="60" y="462">4-wire cable per tank: 3.3 V, GND, RX, TX</text>
  <text class="s" x="60" y="482">(shielded, about 3 m, inline connector at the tank)</text>

  <!-- Front wall -->
  <path class="w wall" d="M470 70 V520"/>
  <text class="s" x="478" y="330">front wall</text>
  <text class="s" x="478" y="348">(sealed grommet)</text>

  <!-- ESP32 enclosure -->
  <rect class="dev" x="520" y="360" width="250" height="130" rx="14"/>
  <text class="t" x="645" y="392" text-anchor="middle">XIAO ESP32-S3</text>
  <text class="s" x="645" y="414" text-anchor="middle">ESPHome, two UARTs</text>
  <text class="s" x="645" y="436" text-anchor="middle">wakes each sensor every 60 s</text>
  <text class="s" x="645" y="458" text-anchor="middle">parses level, temp, echo, tilt</text>
  <text class="s" x="645" y="480" text-anchor="middle">local web page</text>

  <!-- Power -->
  <rect class="box" x="520" y="200" width="250" height="110" rx="14"/>
  <text class="t" x="645" y="232" text-anchor="middle">12 V to 5 V regulator</text>
  <text class="s" x="645" y="254" text-anchor="middle">Pololu D24V5F5 + 470 uF</text>
  <text class="s" x="645" y="276" text-anchor="middle">fed from a fused 12 V circuit</text>
  <text class="s" x="645" y="298" text-anchor="middle">2 A fuse, about 1-2 Ah per day</text>
  <path class="w pos" d="M645 310 V360"/>
  <text class="s" x="655" y="340">5 V</text>
  <path class="w pos" d="M645 120 V200"/>
  <rect class="box" x="560" y="80" width="170" height="40" rx="10"/>
  <text class="s" x="645" y="106" text-anchor="middle">Trailer 12 V (fused)</text>

  <!-- Wi-Fi to Home Assistant -->
  <path class="w wifi" d="M770 425 H860"/>
  <text class="s" x="815" y="412" text-anchor="middle">Wi-Fi</text>
  <rect class="ha" x="860" y="360" width="210" height="130" rx="14"/>
  <text class="t" x="965" y="392" text-anchor="middle">Home Assistant</text>
  <text class="s" x="965" y="414" text-anchor="middle">Tank 1 / Tank 2 Propane %</text>
  <text class="s" x="965" y="436" text-anchor="middle">pounds remaining</text>
  <text class="s" x="965" y="458" text-anchor="middle">temperature, diagnostics</text>
  <text class="s" x="965" y="480" text-anchor="middle">low-propane alert</text>

  <!-- Key -->
  <text class="s" x="40" y="520">No batteries: sensors run from the ESP32's 3.3 V output; the sensor sleeps between readings.</text>
  <text class="s" x="40" y="542">Sensors sit in magnetic collars with silicone grease, so they move to a new cylinder in a minute (epoxy is the fallback).</text>
</svg>
