<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Propane tank monitor wiring schematic</title>
  <desc id="desc">A fused 12 volt feed enters a Pololu D24V5F5 buck regulator with a 470 microfarad capacitor across its input. The regulator's 5 volt output goes to the XIAO ESP32-S3 5V pin and its ground to the XIAO ground. The XIAO 3V3 pin powers both sensors' red VCC leads; the XIAO ground goes to both black GND leads and to the cable shields. Sensor 1's yellow RX lead connects to XIAO D6, GPIO43, and its green TX lead to XIAO D7, GPIO44. Sensor 2's yellow RX lead connects to XIAO D4, GPIO5, and its green TX lead to XIAO D5, GPIO6. GPIO3 on D2 is avoided because it is a strapping pin.</desc>
  <defs>
    <style>
      .box{fill:#f5f7fa;stroke:#243b53;stroke-width:3}
      .dev{fill:#e3f8ff;stroke:#186faf;stroke-width:3}
      .sens{fill:#fff3c4;stroke:#b44d12;stroke-width:3}
      .t{font:600 18px system-ui,sans-serif;fill:#102a43}
      .s{font:14px system-ui,sans-serif;fill:#334e68}
      .pin{font:600 13px ui-monospace,monospace;fill:#102a43}
      .w{fill:none;stroke-width:4}
      .pos{stroke:#c53030}
      .neg{stroke:#243b53}
      .v33{stroke:#d97706}
      .rx{stroke:#7b2cbf}
      .tx{stroke:#15803d}
      .sh{stroke:#829ab1;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1100" height="660" rx="24" fill="#fff"/>
  <text class="t" x="40" y="40">Wiring: 12 V feed, regulator, XIAO ESP32-S3 and two DYP L06 sensors</text>

  <!-- 12 V source and fuse -->
  <rect class="box" x="40" y="90" width="170" height="70" rx="12"/>
  <text class="t" x="125" y="120" text-anchor="middle">12 V feed</text>
  <text class="s" x="125" y="142" text-anchor="middle">2 A fuse at source</text>
  <path class="w pos" d="M210 110 H300"/>
  <path class="w neg" d="M210 140 H300"/>
  <text class="s" x="230" y="102">+12 V</text>
  <text class="s" x="230" y="160">GND</text>

  <!-- Regulator -->
  <rect class="box" x="300" y="80" width="190" height="90" rx="12"/>
  <text class="t" x="395" y="110" text-anchor="middle">D24V5F5</text>
  <text class="s" x="395" y="132" text-anchor="middle">12 V to 5 V buck</text>
  <text class="s" x="395" y="154" text-anchor="middle">470 uF across VIN/GND</text>
  <path class="w pos" d="M490 110 H560 V250 H600"/>
  <path class="w neg" d="M490 140 H540 V280 H600"/>
  <text class="s" x="500" y="102">5 V</text>

  <!-- XIAO -->
  <rect class="dev" x="600" y="200" width="200" height="330" rx="14"/>
  <text class="t" x="700" y="232" text-anchor="middle">XIAO ESP32-S3</text>
  <text class="pin" x="610" y="255">5V</text>
  <text class="pin" x="610" y="285">GND</text>
  <text class="pin" x="610" y="325">3V3</text>
  <text class="pin" x="610" y="365">D6 GPIO43 TX</text>
  <text class="pin" x="610" y="395">D7 GPIO44 RX</text>
  <text class="pin" x="610" y="445">D4 GPIO5 TX</text>
  <text class="pin" x="610" y="475">D5 GPIO6 RX</text>
  <text class="s" x="700" y="552" text-anchor="middle">D2 (GPIO3) not used: strapping pin</text>

  <!-- Wires from XIAO to the sensors -->
  <!-- 3V3 -->
  <path class="w v33" d="M800 320 H840 V160 H900"/>
  <path class="w v33" d="M840 320 V440 H900"/>
  <!-- GND -->
  <path class="w neg" d="M800 280 H860 V190 H900"/>
  <path class="w neg" d="M860 280 V470 H900"/>
  <!-- UART 1 -->
  <path class="w rx" d="M800 360 H880 V220 H900"/>
  <path class="w tx" d="M800 390 H870 V250 H900"/>
  <!-- UART 2 -->
  <path class="w rx" d="M800 440 H880 V500 H900"/>
  <path class="w tx" d="M800 470 H870 V530 H900"/>

  <!-- Sensor 1 -->
  <rect class="sens" x="900" y="100" width="185" height="190" rx="12"/>
  <text class="t" x="992" y="125" text-anchor="middle">Sensor 1, tank 1</text>
  <text class="pin" x="910" y="165">red VCC</text>
  <text class="pin" x="910" y="195">black GND</text>
  <text class="pin" x="910" y="225">yellow RX</text>
  <text class="pin" x="910" y="255">green TX</text>
  <text class="s" x="992" y="280" text-anchor="middle">DYP-L062MTW-V1.0</text>

  <!-- Sensor 2 -->
  <rect class="sens" x="900" y="380" width="185" height="190" rx="12"/>
  <text class="t" x="992" y="405" text-anchor="middle">Sensor 2, tank 2</text>
  <text class="pin" x="910" y="445">red VCC</text>
  <text class="pin" x="910" y="475">black GND</text>
  <text class="pin" x="910" y="505">yellow RX</text>
  <text class="pin" x="910" y="535">green TX</text>
  <text class="s" x="992" y="560" text-anchor="middle">DYP-L062MTW-V1.0</text>

  <!-- Shield note -->
  <text class="s" x="40" y="608">Cable shields: connect to XIAO GND at the ESP32 end only. Twist each sensor's four wires; keep runs under about 3 m.</text>
  <text class="s" x="40" y="632">ESP32 TX (yellow lead) wakes the sensor; sensor TX (green lead) carries the 10-byte reading at 115200 baud, 3.3 V logic.</text>

  <!-- Legend -->
  <rect class="box" x="40" y="220" width="250" height="165" rx="12"/>
  <text class="t" x="165" y="248" text-anchor="middle">Wire colours</text>
  <path class="w pos" d="M55 268 H95"/><text class="s" x="105" y="273">12 V / 5 V positive</text>
  <path class="w neg" d="M55 293 H95"/><text class="s" x="105" y="298">ground</text>
  <path class="w v33" d="M55 318 H95"/><text class="s" x="105" y="323">3.3 V to sensors</text>
  <path class="w rx" d="M55 343 H95"/><text class="s" x="105" y="348">ESP32 TX to sensor RX</text>
  <path class="w tx" d="M55 363 H95"/><text class="s" x="105" y="368">sensor TX to ESP32 RX</text>
</svg>
