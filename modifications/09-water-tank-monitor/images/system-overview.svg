<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc">
  <title id="title">Casita water tank monitor: system overview (two devices)</title>
  <desc id="desc">Two separate ESPHome devices, one per tank. Fresh device: a Garnet SeeLeveL 710-ES3 capacitive sender is stuck to the side of the 23 gallon fresh water tank and wired to an enclosure in the fresh tank bay holding a three-transistor SeeLeveL interface circuit, a 12 volt to 5 volt buck regulator and a XIAO ESP32-S3, powered from the fused 12 volt water pump circuit. Grey device: a DYP L02 ultrasonic sensor is glued to the underside of the 32 gallon grey belly tank; its cable comes up through the floor to a second enclosure in the closet holding its own buck regulator and XIAO ESP32-S3, powered from a fused 12 volt circuit at the closet. Each device publishes its tank's percent, gallons and diagnostics over Wi-Fi to the trailer's Home Assistant, which feeds the e-ink dashboard and the home Home Assistant over Tailscale. A black tank would be a third device of the same kind as the fresh one.</desc>
  <defs>
    <style>
      .tank{fill:#e3f8ff;stroke:#186faf;stroke-width:3}
      .grey{fill:#e9ecef;stroke:#495057;stroke-width:3}
      .black{fill:#f1f3f5;stroke:#868e96;stroke-width:3;stroke-dasharray:10 7}
      .housing{fill:#fffaf0;stroke:#b44d12;stroke-width:3;stroke-dasharray:12 8}
      .esp{fill:#e3f8ff;stroke:#186faf;stroke-width:3}
      .reg{fill:#fde8e8;stroke:#c53030;stroke-width:3}
      .iface{fill:#efe9ff;stroke:#6b46c1;stroke-width:3}
      .ha{fill:#e6fffa;stroke:#0f766e;stroke-width:3}
      .pwrsrc{fill:#fff3c4;stroke:#b44d12;stroke-width:3}
      .t{font:600 20px system-ui,sans-serif;fill:#102a43}
      .s{font:15px system-ui,sans-serif;fill:#334e68}
      .w{fill:none;stroke-width:4}
      .sig{stroke:#186faf}
      .uart{stroke:#2f855a}
      .pwr{stroke:#c53030}
      .rf{stroke:#0f766e;stroke-dasharray:10 7}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334e68"/></marker>
  </defs>
  <rect width="1100" height="670" rx="24" fill="#fff"/>

  <!-- ============ Fresh device ============ -->
  <rect class="tank" x="30" y="30" width="200" height="150" rx="16"/>
  <text class="t" x="120" y="64" text-anchor="middle">Fresh tank</text>
  <text class="s" x="120" y="90" text-anchor="middle">23 gal, 12 in tall</text>
  <text class="s" x="120" y="112" text-anchor="middle">rear passenger bay</text>
  <text class="s" x="120" y="150" text-anchor="middle">710-ES3 on the side</text>
  <rect x="206" y="50" width="14" height="110" rx="4" fill="#6b46c1"/>

  <rect class="pwrsrc" x="30" y="200" width="200" height="70" rx="12"/>
  <text class="t" x="130" y="228" text-anchor="middle">12 V, fused</text>
  <text class="s" x="130" y="252" text-anchor="middle">pump circuit, 2 A inline</text>

  <rect class="housing" x="290" y="20" width="480" height="270" rx="20"/>
  <text class="t" x="530" y="52" text-anchor="middle">Fresh device: enclosure in the fresh tank bay</text>

  <rect class="iface" x="320" y="75" width="180" height="105" rx="12"/>
  <text class="t" x="410" y="108" text-anchor="middle" style="font-size:17px">SeeLeveL interface</text>
  <text class="s" x="410" y="134" text-anchor="middle">2N3906 + 2 x 2N3904</text>
  <text class="s" x="410" y="158" text-anchor="middle">12 V pulses, 3.3 V reply</text>

  <rect class="reg" x="320" y="200" width="180" height="70" rx="12"/>
  <text class="t" x="410" y="228" text-anchor="middle">Buck regulator</text>
  <text class="s" x="410" y="252" text-anchor="middle">12 V to 5 V, 470 uF in</text>

  <rect class="esp" x="570" y="75" width="170" height="195" rx="12"/>
  <text class="t" x="655" y="108" text-anchor="middle">XIAO ESP32-S3</text>
  <text class="s" x="655" y="134" text-anchor="middle">casita-water-</text>
  <text class="s" x="655" y="154" text-anchor="middle">monitor-fresh</text>
  <text class="s" x="655" y="182" text-anchor="middle">D4 / D5: interface</text>
  <text class="s" x="655" y="206" text-anchor="middle">local web page</text>

  <path class="w sig" d="M230 105 H320"/>
  <text class="s" x="260" y="96" text-anchor="middle">blue</text>
  <text class="s" x="260" y="126" text-anchor="middle">black</text>
  <path class="w sig" d="M500 125 H570"/>
  <text class="s" x="535" y="116" text-anchor="middle">TX RX</text>
  <path class="w pwr" d="M230 235 H320"/>
  <path class="w pwr" d="M275 235 V160 H320"/>
  <path class="w pwr" d="M500 235 H570"/>
  <text class="s" x="535" y="226" text-anchor="middle">5 V</text>

  <!-- ============ Grey device ============ -->
  <rect class="grey" x="30" y="320" width="200" height="110" rx="16"/>
  <text class="t" x="130" y="354" text-anchor="middle">Grey tank</text>
  <text class="s" x="130" y="380" text-anchor="middle">32 gal, about 4 in tall</text>
  <text class="s" x="130" y="402" text-anchor="middle">belly tank, under floor</text>
  <circle cx="130" cy="432" r="12" fill="#2f855a"/>
  <text class="s" x="130" y="466" text-anchor="middle">DYP-L02 glued underneath</text>

  <rect class="pwrsrc" x="30" y="490" width="200" height="70" rx="12"/>
  <text class="t" x="130" y="518" text-anchor="middle">12 V, fused</text>
  <text class="s" x="130" y="542" text-anchor="middle">closet circuit, 2 A inline</text>

  <rect class="housing" x="290" y="320" width="480" height="240" rx="20"/>
  <text class="t" x="530" y="352" text-anchor="middle">Grey device: enclosure in the closet</text>

  <rect class="reg" x="320" y="470" width="180" height="70" rx="12"/>
  <text class="t" x="410" y="498" text-anchor="middle">Buck regulator</text>
  <text class="s" x="410" y="522" text-anchor="middle">12 V to 5 V, 470 uF in</text>

  <rect class="esp" x="570" y="375" width="170" height="165" rx="12"/>
  <text class="t" x="655" y="408" text-anchor="middle">XIAO ESP32-S3</text>
  <text class="s" x="655" y="434" text-anchor="middle">casita-water-</text>
  <text class="s" x="655" y="454" text-anchor="middle">monitor-grey</text>
  <text class="s" x="655" y="482" text-anchor="middle">D7: L02 UART RX</text>
  <text class="s" x="655" y="506" text-anchor="middle">3V3 powers the L02</text>

  <path class="w uart" d="M142 432 H260 V410 H570"/>
  <text class="s" x="300" y="434">3V3, GND, TX at 9600 baud,</text>
  <text class="s" x="300" y="454">up through the floor</text>
  <path class="w pwr" d="M230 525 H320"/>
  <path class="w pwr" d="M500 505 H570"/>
  <text class="s" x="535" y="496" text-anchor="middle">5 V</text>

  <!-- ============ Black tank, future ============ -->
  <rect class="black" x="30" y="580" width="740" height="50" rx="14"/>
  <text class="s" x="400" y="611" text-anchor="middle" fill="#868e96">Future: black tank as a third device (casita-water-monitor-black), built like the fresh one</text>

  <!-- ============ Home Assistant ============ -->
  <rect class="ha" x="830" y="60" width="240" height="120" rx="16"/>
  <text class="t" x="950" y="100" text-anchor="middle">Trailer Home Assistant</text>
  <text class="s" x="950" y="126" text-anchor="middle">two ESPHome devices</text>
  <text class="s" x="950" y="150" text-anchor="middle">% and gallons, alerts</text>
  <path class="w rf" d="M740 170 H790 V110 H830" marker-end="url(#arrow)"/>
  <path class="w rf" d="M740 440 H805 V150 H830" marker-end="url(#arrow)"/>
  <text class="s" x="800" y="300" text-anchor="end">Wi-Fi</text>

  <rect class="ha" x="830" y="250" width="240" height="90" rx="16"/>
  <text class="t" x="950" y="285" text-anchor="middle">E-ink dashboard</text>
  <text class="s" x="950" y="311" text-anchor="middle">mod 08, water gauges</text>
  <path class="w rf" d="M950 180 V250" marker-end="url(#arrow)"/>

  <rect class="ha" x="830" y="400" width="240" height="90" rx="16"/>
  <text class="t" x="950" y="435" text-anchor="middle">Home Home Assistant</text>
  <text class="s" x="950" y="461" text-anchor="middle">mirrored over Tailscale</text>
  <path class="w rf" d="M1070 120 H1088 V445 H1070" marker-end="url(#arrow)"/>

  <text class="s" x="550" y="655" text-anchor="middle">Nothing enters either tank. Each device has its own ESP32, regulator, fuse and enclosure, and runs from the trailer's 12 V; no batteries.</text>
</svg>
