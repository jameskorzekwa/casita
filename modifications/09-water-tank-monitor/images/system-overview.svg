<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Casita water tank monitor: system overview</title>
  <desc id="desc">A Garnet SeeLeveL 710-ES3 capacitive sender is stuck to the side of the 16 gallon fresh water tank and a DYP L02 ultrasonic sensor is glued to the underside of the 32 gallon grey water tank. Both connect to a small enclosure near the fresh tank bay holding a 12 volt to 5 volt buck regulator, a three-transistor SeeLeveL interface circuit and a XIAO ESP32-S3. The enclosure is powered from the fused 12 volt water pump circuit. The ESP32 runs ESPHome and publishes fresh and grey tank percent, gallons and diagnostics over Wi-Fi to the trailer's Home Assistant, which feeds the e-ink dashboard and the home Home Assistant over Tailscale. The black tank is a future addition on the same SeeLeveL wires.</desc>
  <defs>
    <style>
      .tank{fill:#e3f8ff;stroke:#186faf;stroke-width:3}
      .grey{fill:#e9ecef;stroke:#495057;stroke-width:3}
      .black{fill:#f1f3f5;stroke:#868e96;stroke-width:3;stroke-dasharray:10 7}
      .housing{fill:#fffaf0;stroke:#b44d12;stroke-width:3;stroke-dasharray:12 8}
      .esp{fill:#e3f8ff;stroke:#186faf;stroke-width:3}
      .reg{fill:#fde8e8;stroke:#c53030;stroke-width:3}
      .iface{fill:#efe9ff;stroke:#6b46c1;stroke-width:3}
      .ha{fill:#e6fffa;stroke:#0f766e;stroke-width:3}
      .pwrsrc{fill:#fff3c4;stroke:#b44d12;stroke-width:3}
      .t{font:600 20px system-ui,sans-serif;fill:#102a43}
      .s{font:15px system-ui,sans-serif;fill:#334e68}
      .w{fill:none;stroke-width:4}
      .sig{stroke:#186faf}
      .uart{stroke:#2f855a}
      .pwr{stroke:#c53030}
      .rf{stroke:#0f766e;stroke-dasharray:10 7}
      .fut{stroke:#868e96;stroke-dasharray:6 6}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334e68"/></marker>
  </defs>
  <rect width="1100" height="620" rx="24" fill="#fff"/>

  <!-- Fresh tank with sender -->
  <rect class="tank" x="30" y="40" width="200" height="150" rx="16"/>
  <text class="t" x="130" y="76" text-anchor="middle">Fresh tank</text>
  <text class="s" x="130" y="102" text-anchor="middle">16 gal, 12 in tall</text>
  <text class="s" x="130" y="124" text-anchor="middle">rear passenger side</text>
  <rect x="206" y="60" width="14" height="110" rx="4" fill="#6b46c1"/>
  <text class="s" x="130" y="212" text-anchor="middle">710-ES3 sender on the side</text>

  <!-- Grey tank with L02 -->
  <rect class="grey" x="30" y="250" width="200" height="110" rx="16"/>
  <text class="t" x="130" y="286" text-anchor="middle">Grey tank</text>
  <text class="s" x="130" y="312" text-anchor="middle">32 gal, about 4 in tall</text>
  <text class="s" x="130" y="334" text-anchor="middle">under the floor</text>
  <circle cx="130" cy="362" r="12" fill="#2f855a"/>
  <text class="s" x="130" y="394" text-anchor="middle">DYP-L02 glued underneath</text>

  <!-- Black tank future -->
  <rect class="black" x="30" y="440" width="200" height="100" rx="16"/>
  <text class="t" x="130" y="476" text-anchor="middle" fill="#868e96">Black tank</text>
  <text class="s" x="130" y="502" text-anchor="middle">15 gal, under the toilet</text>
  <text class="s" x="130" y="524" text-anchor="middle">future: 2nd sender, tank 3</text>

  <!-- Enclosure -->
  <rect class="housing" x="300" y="40" width="470" height="500" rx="20"/>
  <text class="t" x="535" y="72" text-anchor="middle">Enclosure near the fresh tank bay</text>

  <rect class="iface" x="330" y="110" width="180" height="120" rx="12"/>
  <text class="t" x="420" y="146" text-anchor="middle">SeeLeveL</text>
  <text class="t" x="420" y="170" text-anchor="middle">interface</text>
  <text class="s" x="420" y="196" text-anchor="middle">BS250 + 2 x 2N3904</text>
  <text class="s" x="420" y="216" text-anchor="middle">12 V pulses, 3.3 V reply</text>

  <rect class="reg" x="330" y="300" width="180" height="90" rx="12"/>
  <text class="t" x="420" y="336" text-anchor="middle">Buck regulator</text>
  <text class="s" x="420" y="360" text-anchor="middle">12 V to 5 V, 470 uF in</text>

  <rect class="esp" x="570" y="150" width="170" height="240" rx="12"/>
  <text class="t" x="655" y="190" text-anchor="middle">XIAO</text>
  <text class="t" x="655" y="214" text-anchor="middle">ESP32-S3</text>
  <text class="s" x="655" y="246" text-anchor="middle">ESPHome</text>
  <text class="s" x="655" y="270" text-anchor="middle">D4 / D5: sender</text>
  <text class="s" x="655" y="292" text-anchor="middle">D7: L02 UART RX</text>
  <text class="s" x="655" y="314" text-anchor="middle">3V3 powers the L02</text>
  <text class="s" x="655" y="346" text-anchor="middle">local web page</text>
  <text class="s" x="655" y="368" text-anchor="middle">on the trailer Wi-Fi</text>

  <!-- Sender wires -->
  <path class="w sig" d="M230 110 H330"/>
  <text class="s" x="280" y="100" text-anchor="middle">blue + black</text>
  <path class="w fut" d="M230 470 H270 V170 H330"/>
  <text class="s" x="130" y="562" text-anchor="middle">shares the sender wires</text>
  <!-- Interface to ESP -->
  <path class="w sig" d="M510 170 H570"/>
  <text class="s" x="540" y="160" text-anchor="middle">TX RX</text>
  <!-- L02 wires -->
  <path class="w uart" d="M230 305 H285 V265 H550 V250 H570"/>
  <text class="s" x="545" y="287" text-anchor="end">3V3, GND, TX at 9600 baud</text>
  <!-- Buck to ESP -->
  <path class="w pwr" d="M510 345 H550 V330 H570"/>
  <text class="s" x="540" y="375" text-anchor="middle">5 V</text>
  <!-- 12 V to interface -->
  <path class="w pwr" d="M360 300 V230"/>
  <text class="s" x="350" y="296" text-anchor="end">12 V</text>

  <!-- Power source -->
  <rect class="pwrsrc" x="320" y="440" width="200" height="80" rx="12"/>
  <text class="t" x="420" y="472" text-anchor="middle">12 V, fused</text>
  <text class="s" x="420" y="498" text-anchor="middle">water pump circuit, 2 A inline</text>
  <path class="w pwr" d="M420 440 V390" marker-end="url(#arrow)"/>

  <!-- HA -->
  <rect class="ha" x="830" y="150" width="240" height="120" rx="16"/>
  <text class="t" x="950" y="190" text-anchor="middle">Trailer Home Assistant</text>
  <text class="s" x="950" y="216" text-anchor="middle">ESPHome integration</text>
  <text class="s" x="950" y="240" text-anchor="middle">fresh / grey % and gallons, alerts</text>
  <path class="w rf" d="M740 230 H830" marker-end="url(#arrow)"/>
  <text class="s" x="785" y="252" text-anchor="middle">Wi-Fi</text>

  <rect class="ha" x="830" y="320" width="240" height="90" rx="16"/>
  <text class="t" x="950" y="355" text-anchor="middle">E-ink dashboard</text>
  <text class="s" x="950" y="381" text-anchor="middle">mod 08, water gauges fill in</text>
  <path class="w rf" d="M950 270 V320" marker-end="url(#arrow)"/>

  <rect class="ha" x="830" y="450" width="240" height="90" rx="16"/>
  <text class="t" x="950" y="485" text-anchor="middle">Home Home Assistant</text>
  <text class="s" x="950" y="511" text-anchor="middle">mirrored over Tailscale, as mod 04</text>
  <path class="w rf" d="M1070 210 H1088 V495 H1070" marker-end="url(#arrow)"/>

  <text class="s" x="550" y="590" text-anchor="middle">Nothing enters either tank. Both sensors read through the plastic wall; the ESP32 and sensors run from the trailer's 12 V, no batteries.</text>
</svg>
