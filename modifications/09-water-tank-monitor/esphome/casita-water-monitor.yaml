# Casita water tank monitor (SeeLeveL sender + DYP L02 ultrasonic sensor)
#
# A Seeed Studio XIAO ESP32-S3 reads two very different tank sensors:
#
#   Fresh tank: a Garnet SeeLeveL II 710-ES3 capacitive sender stuck to the
#   outside of the tank. It has two wires (blue data, black ground) and speaks
#   Garnet's pulse protocol, so the ESP32 talks to it through a small
#   three-transistor interface circuit (see ../README.md "SeeLeveL interface")
#   using the open-source esphome-seelevel component.
#
#   Grey tank: a DYP-L023MUW-V1.0 ("UART automatic") ultrasonic sensor glued to
#   the underside of the tank. It measures the liquid height through the plastic
#   wall once a second and streams a 4-byte frame at 9600 baud, which is the
#   same frame as the DYP DS1603L, so ESPHome's built-in ds1603l platform reads
#   it directly.
#
# Everything is powered from the trailer's 12 V system through a 5 V buck
# regulator; there are no batteries. See ../README.md before flashing.
#
# Entity names omit the device name; Home Assistant prefixes them with the
# friendly name, e.g. sensor.casita_water_monitor_fresh_tank. The e-ink
# dashboard (mod 08) expects exactly:
#   sensor.casita_water_monitor_fresh_tank   (% full)
#   sensor.casita_water_monitor_grey_tank    (% full)
#   sensor.casita_water_monitor_black_tank   (% full, future)

substitutions:
  name: casita-water-monitor
  friendly_name: Casita Water Monitor

  # --- Fresh tank (SeeLeveL 710-ES3) ---
  # Number of segmented pads left on the sender after cutting it to the tank.
  # A 12 in tall tank with 1/2 in gaps top and bottom takes 8 pads (about
  # 10.8 in). The sender reports 10 segments regardless; the missing ones
  # read 255 and are ignored. Set this to the pads you actually kept.
  fresh_segments: 8
  # Seconds between sender polls. Each poll powers the sender for about 15 ms.
  fresh_update_interval: 30s
  # XIAO D4 = GPIO5 drives the interface TX; D5 = GPIO6 reads RX.
  seelevel_tx_pin: GPIO5
  seelevel_rx_pin: GPIO6

  # --- Grey tank (DYP-L02) ---
  # Liquid height in mm that the sensor reports when the tank is full. The
  # 32 gal tank measured about 4 in tall outside, so about 90 mm inside.
  # ASSUMED, TO CONFIRM: set it from the first calibration fill (README
  # "Calibrate") or press "Grey Tank Mark Full"; the value is then stored in
  # flash and this default is ignored.
  grey_full_level_mm: "90"
  # Grey tank capacity in US gallons (32 gal on the 2026 17 ft; 25 gal on
  # older ones).
  grey_capacity_gal: "32"
  # XIAO D7 = GPIO44 receives the sensor's TX (yellow lead). No TX needed.
  l02_rx_pin: GPIO44

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32s3
  variant: ESP32S3
  framework:
    type: esp-idf

external_components:
  # Garnet SeeLeveL sender transceiver and sensors (MIT, j9brown).
  - source: github://j9brown/esphome-seelevel@main
    components: [seelevel]
    refresh: 1d

# The grey tank "Full Level" calibration is saved to flash when changed.
preferences:
  flash_write_interval: 1min

logger:
  # The L02 uses a hardware UART on GPIO pins; keep logging on the USB port.
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Casita Water Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

time:
  - platform: sntp
    id: sntp_time

# ---------------------------------------------------------------------------
# Fresh tank: SeeLeveL sender through the interface circuit
# ---------------------------------------------------------------------------

seelevel:
  id: seelevel_bus
  tx_pin: ${seelevel_tx_pin}
  rx_pin:
    number: ${seelevel_rx_pin}
    mode:
      input: true
      pullup: true

# ---------------------------------------------------------------------------
# Grey tank: DYP-L02 on its own UART, 9600 8N1, streaming once a second
# ---------------------------------------------------------------------------

uart:
  - id: uart_grey
    rx_pin:
      number: ${l02_rx_pin}
      mode:
        input: true
        pullup: true
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1

globals:
  # Seconds since the L02 last produced a frame, to detect a dead sensor.
  - id: grey_silent_s
    type: int
    restore_value: false
    initial_value: "0"

number:
  - platform: template
    name: "Grey Tank Full Level"
    id: grey_full_level
    icon: mdi:ruler
    unit_of_measurement: mm
    min_value: 30
    max_value: 400
    step: 1
    initial_value: ${grey_full_level_mm}
    restore_value: true
    optimistic: true
    entity_category: config
    mode: box
    on_value:
      # Recompute the percentage right away with the new calibration.
      - lambda: |-
          if (id(grey_level).has_state() && !std::isnan(id(grey_level).state) && x > 0) {
            float pct = id(grey_level).state / x * 100.0f;
            pct = std::max(0.0f, std::min(100.0f, pct));
            id(grey_percent).publish_state(pct);
            id(grey_volume).publish_state(pct / 100.0f * ${grey_capacity_gal});
          }

button:
  - platform: template
    name: "Grey Tank Mark Full"
    icon: mdi:water-alert
    entity_category: config
    on_press:
      - lambda: |-
          float level = id(grey_level).state;
          if (!id(grey_level).has_state() || std::isnan(level) || level < 30.0f) {
            ESP_LOGW("grey", "Mark Full ignored: no valid level reading (%.0f mm)", level);
            return;
          }
          ESP_LOGI("grey", "Full level set to %.0f mm", level);
          auto call = id(grey_full_level).make_call();
          call.set_value(level);
          call.perform();
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Grey Tank Sensor Online"
    id: grey_online
    device_class: connectivity
    entity_category: diagnostic

sensor:
  # ----- Fresh tank -----
  - platform: seelevel
    seelevel_id: seelevel_bus
    # Tank 1 = fresh: a sender with no programming tabs cut.
    tank: 1
    segments: ${fresh_segments}
    update_interval: ${fresh_update_interval}
    level:
      # Raw level, 0 to fresh_segments, in sender segments. Diagnostic.
      name: "Fresh Tank Level"
      id: fresh_level
      icon: mdi:waves-arrow-up
      unit_of_measurement: seg
      accuracy_decimals: 2
      entity_category: diagnostic
      on_value:
        - lambda: |-
            if (std::isnan(x)) {
              id(fresh_percent).publish_state(NAN);
              return;
            }
            float pct = x / ${fresh_segments}.0f * 100.0f;
            pct = std::max(0.0f, std::min(100.0f, pct));
            id(fresh_percent).publish_state(pct);
    volume:
      name: "Fresh Tank Volume"
      icon: mdi:water
      unit_of_measurement: gal
      accuracy_decimals: 1
      # Linear map, which assumes a tank of constant cross-section. Add
      # intermediate points if a calibration fill shows otherwise.
      map:
        - level: 0.0
          volume: 0 gal
        # Keep level equal to fresh_segments above and volume equal to the tank
        # capacity (16 gal factory tank; 23 gal is the optional larger one)
        # (substitutions cannot be used here: the map wants real numbers).
        - level: 8.0
          volume: 16 gal
      filters:
        - delta: 0.2
    segment_data:
      # The ten raw segment values, top to bottom, for calibration and
      # troubleshooting. 255 = segment cut off (or saturated), 0 = no water.
      name: "Fresh Tank Segment Data"
      entity_category: diagnostic

  - platform: template
    # The value the e-ink dashboard and Home Assistant alerts use.
    name: "Fresh Tank"
    id: fresh_percent
    icon: mdi:water
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement

  # ----- Grey tank -----
  - platform: ds1603l
    # Reads the DYP-L02's 4-byte frame: FF, mm high, mm low, checksum.
    uart_id: uart_grey
    name: "Grey Tank Level"
    id: grey_level
    icon: mdi:waves-arrow-up
    unit_of_measurement: mm
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      # 0 mm means no echo: below the dead zone (empty), no couplant, or the
      # sensor has come off the tank. Report it as 0 so the tank reads empty.
      - median:
          window_size: 7
          send_every: 5
          send_first_at: 1
      - delta: 1.0
    on_raw_value:
      - lambda: |-
          id(grey_silent_s) = 0;
          if (!id(grey_online).has_state() || !id(grey_online).state) {
            id(grey_online).publish_state(true);
          }
    on_value:
      - lambda: |-
          float full = id(grey_full_level).state;
          if (std::isnan(x) || std::isnan(full) || full <= 0) {
            id(grey_percent).publish_state(NAN);
            id(grey_volume).publish_state(NAN);
            return;
          }
          float pct = x / full * 100.0f;
          pct = std::max(0.0f, std::min(100.0f, pct));
          id(grey_percent).publish_state(pct);
          id(grey_volume).publish_state(pct / 100.0f * ${grey_capacity_gal});

  - platform: template
    name: "Grey Tank"
    id: grey_percent
    icon: mdi:water-opacity
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement

  - platform: template
    name: "Grey Tank Volume"
    id: grey_volume
    icon: mdi:water-opacity
    unit_of_measurement: gal
    accuracy_decimals: 1
    state_class: measurement

  # ----- Device -----
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

interval:
  # The L02 streams every second. If nothing valid arrives for 30 s the
  # sensor, its cable or its power is gone: mark it offline and clear the
  # readings so Home Assistant shows "unknown" instead of a stale level.
  - interval: 1s
    then:
      - lambda: |-
          id(grey_silent_s) += 1;
          if (id(grey_silent_s) == 30) {
            ESP_LOGW("grey", "No frame from the L02 for 30 s");
            id(grey_online).publish_state(false);
            id(grey_percent).publish_state(NAN);
            id(grey_volume).publish_state(NAN);
          }

