# Casita e-ink dashboard (TRMNL 7.5" OG DIY Kit)
#
# Seeed Studio / TRMNL 7.5" (OG) DIY Kit: XIAO ESP32-S3 Plus on the XIAO ePaper
# Driver Board, driving an 800 x 480 monochrome e-paper panel. The ESP32 joins
# the trailer Wi-Fi, connects to the trailer's Home Assistant, reads the
# battery, solar, propane, water and AC entities, and redraws the panel on a
# schedule. Three pages, cycled with Button 2: overview, details, power.
# See ../README.md before flashing.
#
# Entity names omit the device name; Home Assistant prefixes them with the
# friendly name, e.g. sensor.casita_dashboard_dashboard_battery.

substitutions:
  name: casita-dashboard
  friendly_name: Casita Dashboard

  # How often the panel redraws. Redraws are partial refreshes (about 0.4 s,
  # no flash); every full_update_every redraws a fast full refresh (about
  # 1.5 s, one flash) clears ghosting. 10 s and 60 gives a full refresh every
  # 10 minutes.
  refresh_interval: 10s
  full_update_every: "60"

  # --- Entities on the trailer's Home Assistant ---
  # Battery monitor (mod 04)
  batt_soc: sensor.casita_battery_monitor_state_of_charge
  batt_voltage: sensor.casita_battery_monitor_voltage
  batt_current: sensor.casita_battery_monitor_current
  batt_power: sensor.casita_battery_monitor_power
  batt_time_to_empty: sensor.casita_battery_monitor_time_to_empty
  batt_time_to_full: sensor.casita_battery_monitor_time_to_full
  batt_daily_in: sensor.casita_battery_monitor_daily_charged_energy
  batt_daily_out: sensor.casita_battery_monitor_daily_discharged_energy
  batt_charging: binary_sensor.casita_battery_monitor_charging
  # Solar charge controller: Victron SmartSolar MPPT 75 through the Victron
  # BLE integration (Instant Readout). Shown as "--" when out of range.
  solar_power: sensor.outside_casita_solar_panel_solar_power
  solar_current: sensor.outside_casita_solar_panel_battery_current
  solar_yield_today: sensor.outside_casita_solar_panel_yield_today
  solar_state: sensor.outside_casita_solar_panel_charge_state
  solar_error: sensor.outside_casita_solar_panel_charger_error
  # Tank monitor (mod 07). Propane from the casita-tank-monitor ESPHome
  # device; fresh is the owner's template on the Garnet 709-BTP7 display's
  # reading; grey is a template on the Mopeka Bluetooth sensor's reading.
  propane_1: sensor.casita_tank_monitor_propane_1
  propane_1_lb: sensor.casita_tank_monitor_propane_1_remaining
  propane_2: sensor.casita_tank_monitor_propane_2
  propane_2_lb: sensor.casita_tank_monitor_propane_2_remaining
  # Water tanks, percent full. Black shows "--" until a sensor exists.
  water_fresh: sensor.casita_fresh_tank
  water_grey: sensor.casita_grey_tank
  water_black: sensor.casita_water_monitor_black_tank
  # Tank capacities, US gallons, for the gallons shown beside each percent.
  # 2026 Liberty 17 Deluxe with the optional 23 gal fresh tank (16 gal is
  # standard), the 32 gal grey tank fitted to current 17 ft models, and the
  # 15 gal black tank. See docs/trailer.md.
  fresh_gal: "23"
  grey_gal: "32"
  black_gal: "15"
  # AC meter (mod 10, Shelly EM Gen3 "Casita AC Meter"). The shore clamp is
  # not fitted yet (2026-10-28), so shore power reads 0 until it is.
  ac_voltage: sensor.casita_ac_meter_panel_voltage
  ac_frequency: sensor.casita_ac_meter_panel_frequency
  ac_panel_power: sensor.casita_ac_meter_panel_power
  ac_panel_current: sensor.casita_ac_meter_panel_current
  ac_shore_power: sensor.casita_ac_meter_shore_power
  ac_shore_current: sensor.casita_ac_meter_shore_current
  ac_panel_energy: sensor.casita_ac_meter_panel_energy
  # "shore" / "inverter" / "none" / "unknown": a template on the trailer's HA
  # from the AC meter and the inverter (mod 10).
  ac_source: sensor.casita_ac_source
  # Inverter (mod 11, Xantrex Freedom X 2000 through its Bluetooth panel).
  inv_mode: sensor.freedom_x_2000_mode
  inv_load: sensor.freedom_x_2000_load
  inv_ac_out_power: sensor.freedom_x_2000_ac_output_power
  inv_batt_current: sensor.freedom_x_2000_battery_current
  inv_problem: binary_sensor.freedom_x_2000_problem

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      # The driver board gates the battery divider; turn it on before reading.
      - output.turn_on: adc_enable
      - delay: 200ms
      - component.update: dash_batt_voltage

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret dashboard_api_encryption_key

ota:
  - platform: esphome
    password: !secret dashboard_ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
    # Backup: home Wi-Fi, used only when the trailer Wi-Fi is not visible.
    - ssid: !secret wifi_backup_ssid
      password: !secret wifi_backup_password
      priority: 0
  ap:
    ssid: "Casita Dashboard Fallback"
    password: !secret dashboard_fallback_ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - component.update: epaper

# ---------------- Display ----------------
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

font:
  - file: "gfonts://Inter@400"
    id: f_small
    size: 18
  - file: "gfonts://Inter@600"
    id: f_label
    size: 22
  - file: "gfonts://Inter@700"
    id: f_value
    size: 34
  - file: "gfonts://Inter@800"
    id: f_huge
    size: 110

globals:
  - id: page_index
    type: int
    restore_value: false
    initial_value: "0"

output:
  - platform: gpio
    pin: GPIO6
    id: adc_enable

# ---------------- Inputs from Home Assistant ----------------
sensor:
  - platform: homeassistant
    id: soc
    entity_id: ${batt_soc}
    internal: true
  - platform: homeassistant
    id: voltage
    entity_id: ${batt_voltage}
    internal: true
  - platform: homeassistant
    id: current
    entity_id: ${batt_current}
    internal: true
  - platform: homeassistant
    id: power
    entity_id: ${batt_power}
    internal: true
  - platform: homeassistant
    id: time_to_empty
    entity_id: ${batt_time_to_empty}
    internal: true
  - platform: homeassistant
    id: time_to_full
    entity_id: ${batt_time_to_full}
    internal: true
  - platform: homeassistant
    id: daily_in
    entity_id: ${batt_daily_in}
    internal: true
  - platform: homeassistant
    id: daily_out
    entity_id: ${batt_daily_out}
    internal: true
  - platform: homeassistant
    id: solar_w
    entity_id: ${solar_power}
    internal: true
  - platform: homeassistant
    id: solar_a
    entity_id: ${solar_current}
    internal: true
  - platform: homeassistant
    id: solar_wh
    entity_id: ${solar_yield_today}
    internal: true
  - platform: homeassistant
    id: propane1
    entity_id: ${propane_1}
    internal: true
  - platform: homeassistant
    id: propane1_lb
    entity_id: ${propane_1_lb}
    internal: true
  - platform: homeassistant
    id: propane2
    entity_id: ${propane_2}
    internal: true
  - platform: homeassistant
    id: propane2_lb
    entity_id: ${propane_2_lb}
    internal: true
  - platform: homeassistant
    id: fresh
    entity_id: ${water_fresh}
    internal: true
  - platform: homeassistant
    id: grey
    entity_id: ${water_grey}
    internal: true
  - platform: homeassistant
    id: black
    entity_id: ${water_black}
    internal: true
  - platform: homeassistant
    id: ac_volts
    entity_id: ${ac_voltage}
    internal: true
  - platform: homeassistant
    id: ac_watts
    entity_id: ${ac_panel_power}
    internal: true
  - platform: homeassistant
    id: ac_hz
    entity_id: ${ac_frequency}
    internal: true
  - platform: homeassistant
    id: ac_amps
    entity_id: ${ac_panel_current}
    internal: true
  - platform: homeassistant
    id: ac_shore_w
    entity_id: ${ac_shore_power}
    internal: true
  - platform: homeassistant
    id: ac_shore_a
    entity_id: ${ac_shore_current}
    internal: true
  - platform: homeassistant
    id: ac_kwh
    entity_id: ${ac_panel_energy}
    internal: true
  - platform: homeassistant
    id: inv_load_pct
    entity_id: ${inv_load}
    internal: true
  - platform: homeassistant
    id: inv_out_w
    entity_id: ${inv_ac_out_power}
    internal: true
  - platform: homeassistant
    id: inv_batt_a
    entity_id: ${inv_batt_current}
    internal: true

  # ---------------- The dashboard's own battery ----------------
  # Driver board: BAT_ADC on GPIO1 through a 100 k / 100 k divider, gated by
  # ADC_EN on GPIO6. Values from Seeed's ESPHome cookbook for this kit.
  - platform: adc
    pin: GPIO1
    id: dash_batt_voltage
    name: "Dashboard Battery Voltage"
    entity_category: diagnostic
    unit_of_measurement: V
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0
  - platform: template
    id: dash_batt_level
    name: "Dashboard Battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(dash_batt_voltage).state;
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    id: wifi_rssi
    entity_category: diagnostic
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

binary_sensor:
  - platform: homeassistant
    id: charging
    entity_id: ${batt_charging}
    internal: true
  - platform: homeassistant
    id: inv_fault
    entity_id: ${inv_problem}
    internal: true
  # Driver board user buttons (active low). KEY1 redraws, KEY2 changes page.
  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    id: key1
    name: "Button 1"
    entity_category: diagnostic
    on_press:
      - component.update: epaper
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: key2
    name: "Button 2"
    entity_category: diagnostic
    on_press:
      - lambda: id(page_index) = (id(page_index) + 1) % 3;
      - component.update: epaper

switch:
  # Test aid: while on, tank values that have no real sensor are drawn with a
  # new random number every redraw (used to check partial refresh before the
  # tank sensors existed). Real values always take priority. Off by default
  # since 2026-10-28: only the black tank has no sensor now.
  - platform: template
    name: "Demo Tank Values"
    id: demo_tanks
    icon: mdi:dice-multiple
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - component.update: epaper
    on_turn_off:
      - component.update: epaper

number:
  # Refresh mode, changeable live from Home Assistant. 1 = every redraw is a
  # normal full refresh (3.5 s flash); 2 = fast full refresh every other
  # redraw; higher = partial refreshes with a fast full refresh every N.
  - platform: template
    name: "Full Update Every"
    id: full_update_every_n
    icon: mdi:refresh-auto
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${full_update_every}
    min_value: 1
    max_value: 360
    step: 1
    mode: box
    on_value:
      - lambda: id(epaper).set_full_update_every((uint32_t) x);
      - component.update: epaper

button:
  - platform: template
    name: "Refresh Display"
    icon: mdi:refresh
    on_press:
      - component.update: epaper
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

text_sensor:
  - platform: homeassistant
    id: ac_src
    entity_id: ${ac_source}
    internal: true
  - platform: homeassistant
    id: inv_mode_s
    entity_id: ${inv_mode}
    internal: true
  - platform: homeassistant
    id: solar_cs
    entity_id: ${solar_state}
    internal: true
  - platform: homeassistant
    id: solar_err
    entity_id: ${solar_error}
    internal: true
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

display:
  # The kit's panel is a UC8179 (Waveshare 7.5" V2 class). The 7.50inV2p model
  # adds fast full and partial refresh (panels made after September 2023);
  # 7.50inv2 only does slow full refreshes. epaper_spi / Waveshare-7.5in-V2
  # was tried on 2026-10-20 and left the panel blank on this board.
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inV2p
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    update_interval: ${refresh_interval}
    full_update_every: ${full_update_every}
    lambda: |-
      // ---------- helpers ----------
      const int W = 800, H = 480;
      auto ok = [](float v) { return !std::isnan(v); };
      // Horizontal gauge: outline, filled to pct, with tick marks at 25/50/75.
      auto hbar = [&](int x, int y, int w, int h, float pct) {
        it.rectangle(x, y, w, h);
        if (ok(pct)) {
          int fw = (int) ((w - 4) * std::max(0.0f, std::min(100.0f, pct)) / 100.0f);
          if (fw > 0) it.filled_rectangle(x + 2, y + 2, fw, h - 4);
        }
        for (int t = 1; t < 4; t++) {
          int tx = x + (w * t) / 4;
          it.line(tx, y + h, tx, y + h + 5);
        }
      };
      // Vertical tank: outline, filled from the bottom to pct.
      auto vtank = [&](int x, int y, int w, int h, float pct) {
        it.rectangle(x, y, w, h);
        if (ok(pct)) {
          int fh = (int) ((h - 4) * std::max(0.0f, std::min(100.0f, pct)) / 100.0f);
          if (fh > 0) it.filled_rectangle(x + 2, y + h - 2 - fh, w - 4, fh);
        }
      };
      // Hours as "2d 4h" / "6h 20m" / "--".
      auto hours_str = [&](float hrs) -> std::string {
        if (!ok(hrs) || hrs < 0) return "--";
        int m = (int) (hrs * 60.0f + 0.5f);
        char b[24];
        if (m >= 48 * 60) snprintf(b, sizeof b, "%dd %dh", m / 1440, (m % 1440) / 60);
        else snprintf(b, sizeof b, "%dh %02dm", m / 60, m % 60);
        return b;
      };
      // Demo: random stand-in for a missing tank value (Demo Tank Values on).
      auto demo = [&](float v, float lo, float hi) -> float {
        if (ok(v) || !id(demo_tanks).state) return v;
        return lo + random_float() * (hi - lo);
      };
      auto pct_str = [&](float v) -> std::string {
        if (!ok(v)) return "--";
        char b[8]; snprintf(b, sizeof b, "%.0f%%", v); return b;
      };
      // Victron charge state / charger error (HA enum keys) as short text.
      // A charger error, when present, replaces the charge state.
      auto solar_state_str = [&]() -> std::string {
        std::string e = id(solar_err).state, s = id(solar_cs).state;
        if (!e.empty() && e != "no_error" && e != "unknown" && e != "unavailable") return "Error";
        if (s == "off") return "Off";
        if (s == "bulk") return "Bulk";
        if (s == "absorption" || s == "repeated_absorption") return "Absorb";
        if (s == "float") return "Float";
        if (s == "storage") return "Storage";
        if (s == "equalize_manual" || s == "auto_equalize_recondition") return "Equalize";
        if (s == "low_power") return "Low power";
        if (s == "fault") return "Fault";
        if (s == "starting_up") return "Starting";
        if (s.empty() || s == "unknown" || s == "unavailable") return "--";
        return s;
      };
      // Xantrex working mode (HA enum keys) as short text.
      auto inv_mode_str = [&]() -> std::string {
        std::string m = id(inv_mode_s).state;
        if (m == "standby") return "Standby";
        if (m == "line") return "Shore pass-through";
        if (m == "battery") return "Inverting";
        if (m == "fault") return "Fault";
        if (m == "power_saving") return "Power saving";
        if (m.empty() || m == "unknown" || m == "unavailable") return "--";
        return m;
      };
      auto ac_source_str = [&]() -> std::string {
        std::string src = id(ac_src).state;
        if (src == "shore") return "Shore";
        if (src == "inverter") return "Inverter";
        if (src == "none") return "No AC";
        return "--";
      };

      // ---------- header (both pages) ----------
      it.print(16, 12, id(f_value), "CASITA");
      auto now = id(ha_time).now();
      if (now.is_valid()) {
        it.strftime(W / 2, 18, id(f_label), TextAlign::TOP_CENTER, "%a %b %d   %H:%M", now);
      }
      // Dashboard's own battery, top right, only when one is fitted
      // (the sense input reads about 0 V with no battery).
      float db = id(dash_batt_level).state;
      if (ok(db) && id(dash_batt_voltage).state > 3.0f) {
        it.printf(W - 16, 18, id(f_label), TextAlign::TOP_RIGHT, "Panel %.0f%%", db);
      }
      it.filled_rectangle(0, 56, W, 2);

      if (id(page_index) == 0) {
        // ================= PAGE 0: overview =================
        // ---- left column: battery ----
        const int LX = 16, LW = 384;
        it.print(LX, 72, id(f_label), "BATTERY");
        float s = id(soc).state;
        // Layout moved up on 2026-10-22 to make room for the solar line.
        if (ok(s)) it.printf(LX + LW / 2, 168, id(f_huge), TextAlign::CENTER, "%.0f%%", s);
        else it.print(LX + LW / 2, 168, id(f_huge), TextAlign::CENTER, "--");
        hbar(LX, 234, LW, 28, s);
        it.print(LX, 268, id(f_small), "0");
        it.print(LX + LW, 268, id(f_small), TextAlign::TOP_RIGHT, "100");

        float v = id(voltage).state, a = id(current).state, p = id(power).state;
        // voltage / current / power row. Two decimals on V and A and one on W
        // so small changes are visible between partial refreshes.
        int ry = 296;
        if (ok(v)) it.printf(LX, ry, id(f_value), "%.2f V", v); else it.print(LX, ry, id(f_value), "-- V");
        if (ok(a)) it.printf(LX + LW / 2, ry, id(f_value), TextAlign::TOP_CENTER, "%+.2f A", a);
        else it.print(LX + LW / 2, ry, id(f_value), TextAlign::TOP_CENTER, "-- A");
        if (ok(p)) it.printf(LX + LW, ry, id(f_value), TextAlign::TOP_RIGHT, std::fabs(p) < 100 ? "%.1f W" : "%.0f W", std::fabs(p));
        else it.print(LX + LW, ry, id(f_value), TextAlign::TOP_RIGHT, "-- W");

        // status line: charging / discharging and time estimate
        bool chg = id(charging).state;
        std::string status;
        if (!ok(a)) status = "Battery monitor offline";
        else if (chg) status = "Charging  -  full in " + hours_str(id(time_to_full).state);
        else if (a < -0.2f) status = "Discharging  -  empty in " + hours_str(id(time_to_empty).state);
        else status = "Idle";
        it.print(LX, 342, id(f_label), status.c_str());

        float din = id(daily_in).state, dout = id(daily_out).state;
        if (ok(din) && ok(dout))
          it.printf(LX, 370, id(f_small), "Today: +%.2f kWh in, -%.2f kWh out", din, dout);

        // Solar line (Victron MPPT): watts, charge state, yield today
        {
          float sw = id(solar_w).state, swh = id(solar_wh).state;
          std::string label = "SOLAR  ";
          if (ok(sw)) { char b[16]; snprintf(b, sizeof b, "%.0f W  ", sw); label += b; } else label += "-- W  ";
          label += solar_state_str();
          if (ok(swh)) { char b[24]; snprintf(b, sizeof b, "  %.2f kWh", swh / 1000.0f); label += b; }
          it.print(LX, 396, id(f_label), label.c_str());
        }

        // AC line (mod 10): voltage, panel watts, source
        {
          float av = id(ac_volts).state, aw = id(ac_watts).state;
          std::string src = id(ac_src).state;
          std::string label = "AC  ";
          if (ok(av)) { char b[16]; snprintf(b, sizeof b, "%.0f V  ", av); label += b; } else label += "-- V  ";
          if (ok(aw)) { char b[16]; snprintf(b, sizeof b, "%.0f W  ", aw); label += b; } else label += "-- W  ";
          label += ac_source_str();
          float il = id(inv_load_pct).state;
          if (src == "inverter" && ok(il)) { char b[16]; snprintf(b, sizeof b, " %.0f%%", il); label += b; }
          it.print(LX, 424, id(f_label), label.c_str());
        }

        // ---- divider ----
        it.filled_rectangle(416, 70, 2, H - 86);

        // ---- right column, top: propane ----
        const int RX = 440, RW = 344;
        it.print(RX, 72, id(f_label), "PROPANE");
        float p1 = demo(id(propane1).state, 0, 100), p2 = demo(id(propane2).state, 0, 100);
        float l1 = demo(id(propane1_lb).state, 0, 20), l2 = demo(id(propane2_lb).state, 0, 20);
        const int TW = 70, TH = 120, TY = 104;
        // Tanks sit 8 px in from the column edge so "100%" beside tank 2
        // (ends about x = 786) stays on the 800 px panel.
        int t1x = RX + 8, t2x = RX + RW / 2 + 8;
        vtank(t1x, TY, TW, TH, p1);
        vtank(t2x, TY, TW, TH, p2);
        it.print(t1x + TW + 14, TY + 10, id(f_value), pct_str(p1).c_str());
        it.print(t2x + TW + 14, TY + 10, id(f_value), pct_str(p2).c_str());
        if (ok(l1)) it.printf(t1x + TW + 14, TY + 54, id(f_small), "%.1f lb", l1);
        if (ok(l2)) it.printf(t2x + TW + 14, TY + 54, id(f_small), "%.1f lb", l2);
        it.print(t1x + TW / 2, TY + TH + 6, id(f_small), TextAlign::TOP_CENTER, "Tank 1");
        it.print(t2x + TW / 2, TY + TH + 6, id(f_small), TextAlign::TOP_CENTER, "Tank 2");

        // ---- right column, bottom: water ----
        it.filled_rectangle(RX, 262, RW, 1);
        it.print(RX, 276, id(f_label), "WATER");
        // Each row: name, gauge, gallons (large) and percent (small).
        const char *names[3] = {"Fresh", "Grey", "Black"};
        const float cap[3] = {${fresh_gal}, ${grey_gal}, ${black_gal}};
        float lv[3] = {demo(id(fresh).state, 0, 100), demo(id(grey).state, 0, 100), demo(id(black).state, 0, 100)};
        for (int i = 0; i < 3; i++) {
          int y = 310 + i * 54;
          it.print(RX, y + 8, id(f_label), names[i]);
          hbar(RX + 64, y + 8, 96, 24, lv[i]);
          if (ok(lv[i])) it.printf(RX + RW - 100, y - 4, id(f_value), TextAlign::TOP_RIGHT, "%.1f", lv[i] / 100.0f * cap[i]);
          else it.print(RX + RW - 100, y - 4, id(f_value), TextAlign::TOP_RIGHT, "--");
          it.print(RX + RW - 96, y + 12, id(f_small), "gal");
          it.print(RX + RW, y + 12, id(f_small), TextAlign::TOP_RIGHT, pct_str(lv[i]).c_str());
        }
      } else {
        // ================= PAGES 1 and 2: detail tables =================
        int y = 76;
        const int X1 = 16, X2 = 400;
        auto row = [&](int x, const char *label, const std::string &val) {
          it.print(x, y, id(f_label), label);
          it.print(x + 360, y, id(f_label), TextAlign::TOP_RIGHT, val.c_str());
        };
        auto num = [&](float v, const char *fmt) -> std::string {
          if (!ok(v)) return "--";
          char b[32]; snprintf(b, sizeof b, fmt, v); return b;
        };
        if (id(page_index) == 2) {
        // ================= PAGE 2: power (AC, inverter, solar) =================
        // Left: the Shelly EM on the panel feed (mod 10). Shore power and
        // current read 0 until the shore clamp is fitted.
        it.print(X1, y, id(f_value), "AC panel");  y += 40;
        row(X1, "Source", ac_source_str()); y += 28;
        row(X1, "Voltage", num(id(ac_volts).state, "%.1f V")); y += 28;
        row(X1, "Frequency", num(id(ac_hz).state, "%.1f Hz")); y += 28;
        row(X1, "Panel power", num(id(ac_watts).state, "%.1f W")); y += 28;
        row(X1, "Panel current", num(id(ac_amps).state, "%.2f A")); y += 28;
        row(X1, "Shore power", num(id(ac_shore_w).state, "%.1f W")); y += 28;
        row(X1, "Shore current", num(id(ac_shore_a).state, "%.2f A")); y += 28;
        row(X1, "Energy, total", num(id(ac_kwh).state, "%.2f kWh")); y += 28;

        y = 76;
        it.print(X2, y, id(f_value), "Inverter");  y += 40;
        row(X2, "Mode", inv_mode_str()); y += 28;
        row(X2, "Load", num(id(inv_load_pct).state, "%.0f %%") + "  " + num(id(inv_out_w).state, "%.0f W")); y += 28;
        row(X2, "Battery current", num(id(inv_batt_a).state, "%+.1f A")); y += 28;
        row(X2, "Faults", id(inv_fault).has_state() ? (id(inv_fault).state ? "PROBLEM" : "none") : "--"); y += 40;
        it.print(X2, y, id(f_value), "Solar");  y += 40;
        row(X2, "Solar power", num(id(solar_w).state, "%.0f W") + "  " + num(id(solar_a).state, "%.1f A")); y += 28;
        row(X2, "Charge state", solar_state_str()); y += 28;
        row(X2, "Yield today", num(id(solar_wh).state, "%.0f Wh")); y += 28;
        } else {
        // ================= PAGE 1: details (battery, tanks, solar) =================
        // Spacing: 40 px after a heading, 28 px per row, 12 px between
        // sections (tightened on 2026-10-22 to fit the solar section).
        it.print(X1, y, id(f_value), "Battery");  y += 40;
        row(X1, "State of charge", num(id(soc).state, "%.1f %%")); y += 28;
        row(X1, "Voltage", num(id(voltage).state, "%.2f V")); y += 28;
        row(X1, "Current", num(id(current).state, "%+.2f A")); y += 28;
        row(X1, "Power", num(id(power).state, "%.1f W")); y += 28;
        row(X1, "Time to empty", hours_str(id(time_to_empty).state)); y += 28;
        row(X1, "Time to full", hours_str(id(time_to_full).state)); y += 28;
        row(X1, "Charged today", num(id(daily_in).state, "%.2f kWh")); y += 28;
        row(X1, "Discharged today", num(id(daily_out).state, "%.2f kWh")); y += 40;
        row(X1, "This panel", num(id(wifi_rssi).state, "%.0f dBm") + "  " + num(id(dash_batt_voltage).state, "%.2f V")); y += 28;

        y = 76;
        it.print(X2, y, id(f_value), "Tanks");  y += 40;
        row(X2, "Propane 1", num(demo(id(propane1).state, 0, 100), "%.0f %%") + "  " + num(demo(id(propane1_lb).state, 0, 20), "%.1f lb")); y += 28;
        row(X2, "Propane 2", num(demo(id(propane2).state, 0, 100), "%.0f %%") + "  " + num(demo(id(propane2_lb).state, 0, 20), "%.1f lb")); y += 28;
        auto gal = [&](float pct, float cap) -> std::string {
          if (!ok(pct)) return "--";
          char b[32]; snprintf(b, sizeof b, "%.1f gal  %.0f %%", pct / 100.0f * cap, pct); return b;
        };
        row(X2, "Fresh water", gal(demo(id(fresh).state, 0, 100), ${fresh_gal})); y += 28;
        row(X2, "Grey water", gal(demo(id(grey).state, 0, 100), ${grey_gal})); y += 28;
        row(X2, "Black water", gal(demo(id(black).state, 0, 100), ${black_gal})); y += 40;
        it.print(X2, y, id(f_value), "Solar");  y += 40;
        row(X2, "Solar power", num(id(solar_w).state, "%.0f W") + "  " + num(id(solar_a).state, "%.1f A")); y += 28;
        row(X2, "Charge state", solar_state_str()); y += 28;
        row(X2, "Yield today", num(id(solar_wh).state, "%.0f Wh")); y += 28;
        }
      }

      // ---------- footer ----------
      if (now.is_valid()) {
        it.strftime(W - 16, H - 8, id(f_small), TextAlign::BOTTOM_RIGHT, "Updated %H:%M", now);
      }
      it.print(16, H - 8, id(f_small), TextAlign::BOTTOM_LEFT,
               id(page_index) == 0 ? "Button 1: refresh   Button 2: details"
               : id(page_index) == 1 ? "Button 2: power" : "Button 2: overview");
