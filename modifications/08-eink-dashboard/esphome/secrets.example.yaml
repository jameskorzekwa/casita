wifi_ssid: "replace-with-wifi-ssid"
wifi_password: "replace-with-wifi-password"
# Backup network (home Wi-Fi), used only when the trailer Wi-Fi is not visible.
wifi_backup_ssid: "replace-with-backup-ssid"
wifi_backup_password: "replace-with-backup-password"
# The dashboard has its own API key and passwords, separate from the other
# trailer devices. Generate the key: openssl rand -base64 32
# (ESPHome 2026.9 rejects the all-zeros placeholder key.)
dashboard_api_encryption_key: "replace-with-output-of-openssl-rand-base64-32"
dashboard_ota_password: "replace-with-a-strong-ota-password"
dashboard_fallback_ap_password: "replace-with-a-strong-fallback-password"
