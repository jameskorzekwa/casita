# Planned bench candidate; no trailer load is approved by this configuration.
# Board: Waveshare ESP32-S3-POE-ETH-8DI-8RO (owner purchase 2026-10-19).
# Mapping: ESPHome device page waveshare-esp32-s3-eth-8di-8ro and Waveshare wiki.
# Verify received-board input/relay polarity and physical rocker orientation.
# Ethernet/PoE, RS485, RTC, buzzer (GPIO46) and RGB LED (GPIO38) are unused.
esphome:
  name: casita-smart-dc-switches
  friendly_name: Casita Smart DC Switches

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret smart_dc_api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# Trailer Wi-Fi first, home Wi-Fi as a backup (same approach as the battery
# monitor), so the board stays reachable on the bench at home. If neither is
# found the fallback hotspot appears for re-pointing the device.
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_backup_ssid
      password: !secret wifi_backup_password
  reboot_timeout: 0s
  ap:
    ssid: "Casita Smart DC Fallback"
    password: !secret fallback_ap_password

captive_portal:

i2c:
  id: bus_a
  sda: GPIO42
  scl: GPIO41
  scan: true
  frequency: 100kHz

pca9554:
  - id: relay_hub
    i2c_id: bus_a
    address: 0x20

# ALWAYS_OFF is deliberate pending per-load review; not a hardware glitch guarantee.
# Relays 5-8 (TCA9554 P4-P7) are unused. No load feedback is provided.
switch:
  - platform: gpio
    id: load_1
    name: Load 1
    restore_mode: ALWAYS_OFF
    pin:
      pca9554: relay_hub
      number: 0
      mode: OUTPUT
      inverted: false
  - platform: gpio
    id: load_2
    name: Load 2
    restore_mode: ALWAYS_OFF
    pin:
      pca9554: relay_hub
      number: 1
      mode: OUTPUT
      inverted: false
  - platform: gpio
    id: load_3
    name: Load 3
    restore_mode: ALWAYS_OFF
    pin:
      pca9554: relay_hub
      number: 2
      mode: OUTPUT
      inverted: false
  - platform: gpio
    id: load_4
    name: Load 4
    restore_mode: ALWAYS_OFF
    pin:
      pca9554: relay_hub
      number: 3
      mode: OUTPUT
      inverted: false

# Contact closure = pressed. Release has no action; never toggle or call HA.
binary_sensor:
  - platform: gpio
    id: load_1_up
    internal: true
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_on: load_1
  - platform: gpio
    id: load_1_down
    internal: true
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_off: load_1
  - platform: gpio
    id: load_2_up
    internal: true
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_on: load_2
  - platform: gpio
    id: load_2_down
    internal: true
    pin:
      number: GPIO7
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_off: load_2
  - platform: gpio
    id: load_3_up
    internal: true
    pin:
      number: GPIO8
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_on: load_3
  - platform: gpio
    id: load_3_down
    internal: true
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_off: load_3
  - platform: gpio
    id: load_4_up
    internal: true
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_on: load_4
  - platform: gpio
    id: load_4_down
    internal: true
    pin:
      number: GPIO11
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_off: load_4
