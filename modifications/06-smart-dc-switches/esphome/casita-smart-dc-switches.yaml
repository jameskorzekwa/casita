# Planned bench candidate; no trailer load is approved by this configuration.
# Mapping: KinCony forum threads 2617/2618 and ESPHome KC868-A4S device page.
# Verify received-board input/relay polarity and physical rocker orientation.
esphome:
  name: casita-smart-dc-switches
  friendly_name: Casita Smart DC Switches

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

i2c:
  id: bus_a
  sda: GPIO4
  scl: GPIO16
  scan: true

pcf8574:
  - id: pcf_inputs
    i2c_id: bus_a
    address: 0x22
  - id: pcf_relays
    i2c_id: bus_a
    address: 0x24

# ALWAYS_OFF is deliberate pending per-load review; not a hardware glitch guarantee.
# DI9-DI12 (0x24 P4-P7) are unused. No load feedback is provided.
switch:
  - platform: gpio
    id: load_1
    name: Load 1
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: pcf_relays
      number: 0
      mode: OUTPUT
      inverted: true
  - platform: gpio
    id: load_2
    name: Load 2
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: pcf_relays
      number: 1
      mode: OUTPUT
      inverted: true
  - platform: gpio
    id: load_3
    name: Load 3
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: pcf_relays
      number: 2
      mode: OUTPUT
      inverted: true
  - platform: gpio
    id: load_4
    name: Load 4
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: pcf_relays
      number: 3
      mode: OUTPUT
      inverted: true

# Contact closure = pressed. Release has no action; never toggle or call HA.
binary_sensor:
  - platform: gpio
    id: load_1_up
    internal: true
    pin:
      pcf8574: pcf_inputs
      number: 0
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_on: load_1
  - platform: gpio
    id: load_1_down
    internal: true
    pin:
      pcf8574: pcf_inputs
      number: 1
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_off: load_1
  - platform: gpio
    id: load_2_up
    internal: true
    pin:
      pcf8574: pcf_inputs
      number: 2
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_on: load_2
  - platform: gpio
    id: load_2_down
    internal: true
    pin:
      pcf8574: pcf_inputs
      number: 3
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_off: load_2
  - platform: gpio
    id: load_3_up
    internal: true
    pin:
      pcf8574: pcf_inputs
      number: 4
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_on: load_3
  - platform: gpio
    id: load_3_down
    internal: true
    pin:
      pcf8574: pcf_inputs
      number: 5
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_off: load_3
  - platform: gpio
    id: load_4_up
    internal: true
    pin:
      pcf8574: pcf_inputs
      number: 6
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_on: load_4
  - platform: gpio
    id: load_4_down
    internal: true
    pin:
      pcf8574: pcf_inputs
      number: 7
      mode: INPUT
      inverted: true
    filters:
      - delayed_on_off: 25ms
    on_press:
      - switch.turn_off: load_4
