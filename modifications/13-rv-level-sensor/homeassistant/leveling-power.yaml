# Home Assistant scripts and automations for the level sensor (mod 13).
#
# The sensor is always powered (owner decision 2026-10-31: no relay in its
# feed). Low activity between leveling sessions comes from the firmware's
# normal mode (reads every 2 s, reports on a 0.2 degree change or every
# 5 min). These scripts switch Leveling Mode and keep the "last reading"
# helpers up to date for the status cards and the home mirror.
#
# Installed on the trailer HA on 2026-10-31 through the config API (scripts
# and automations are editable in the UI). Record of what was created; not a
# file HA reads.
#
# Helpers: input_number.casita_level_last_side, input_number.casita_level_last_front
# (-90..90 deg, box) and input_datetime.casita_level_last_check. They carry
# the `shared` label on the trailer so the bee2 sync service mirrors them
# to the home HA.

script:
  casita_level_start_leveling:
    alias: "Casita Level: start leveling"
    icon: mdi:spirit-level
    mode: single
    sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.casita_level_leveling_mode

  casita_level_stop_leveling:
    alias: "Casita Level: stop leveling"
    icon: mdi:stop-circle-outline
    mode: single
    sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.casita_level_leveling_mode

  casita_level_record_reading:
    alias: "Casita Level: record last reading"
    icon: mdi:content-save-outline
    mode: single
    sequence:
      - condition: template
        value_template: "{{ is_number(states('sensor.casita_level_side_to_side')) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.casita_level_last_side
        data:
          value: "{{ states('sensor.casita_level_side_to_side') | float(0) | round(1) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.casita_level_last_front
        data:
          value: "{{ states('sensor.casita_level_front_to_back') | float(0) | round(1) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.casita_level_last_check
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

automation:
  casita_level_record_after_leveling:
    alias: "Casita Level: record reading after leveling"
    description: >-
      When Leveling Mode goes off (Stop button, or the firmware's 30-minute
      timeout), save the final reading into the last-reading helpers.
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.casita_level_leveling_mode
        from: "on"
        to: "off"
    actions:
      - action: script.casita_level_record_reading

  casita_level_periodic_record:
    alias: "Casita Level: record reading hourly"
    description: >-
      Copies the sensor's reading into the last-reading helpers once an hour
      so the home dashboard (which mirrors only the helpers) stays current.
      Does nothing until the device has been added to Home Assistant.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "0"
    conditions:
      - condition: state
        entity_id: switch.casita_level_leveling_mode
        state: "off"
    actions:
      - action: script.casita_level_record_reading

  # DEMO ONLY (delete with the Demo view): copies the demo sliders into the
  # last-reading helpers so the demo view and the status cards share one
  # data source. Installed 2026-10-31.
  casita_level_demo_feed:
    alias: "Casita Level DEMO: feed sliders into last reading"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - input_number.casita_level_demo_side
          - input_number.casita_level_demo_front
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.casita_level_last_side
        data:
          value: "{{ states('input_number.casita_level_demo_side') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.casita_level_last_front
        data:
          value: "{{ states('input_number.casita_level_demo_front') | float(0) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.casita_level_last_check
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
