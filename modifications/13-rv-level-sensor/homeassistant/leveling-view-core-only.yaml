# Leveling view using only built-in Home Assistant cards (no HACS). Same
# behaviour as leveling-view.yaml, but instead of the dot-in-a-circle it
# shows two gauges. Use this if button-card is not installed.
#
# For the home Home Assistant, replace "casita_level_" with "rv_casita_level_".

title: Leveling
path: leveling
icon: mdi:spirit-level
cards:
  - type: conditional
    conditions:
      - condition: state
        entity: switch.casita_level_leveling_mode
        state: "off"
    card:
      type: button
      name: Start leveling
      icon: mdi:spirit-level
      icon_height: 80px
      show_state: false
      tap_action:
        action: call-service
        service: switch.turn_on
        target:
          entity_id: switch.casita_level_leveling_mode

  - type: conditional
    conditions:
      - condition: state
        entity: switch.casita_level_leveling_mode
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: markdown
          content: >
            {% set side = states('sensor.casita_level_side_to_side_action') %}
            {% set front = states('sensor.casita_level_front_to_back_action') %}
            {% if is_state('binary_sensor.casita_level_moving', 'on') %}
            ## Hold still...
            {% elif side == 'Level' and front == 'Level' %}
            ## Level. Chock the wheels, then lower the stabilizers.
            {% elif side != 'Level' %}
            ## {{ side }}
            {% if front != 'Level' %}
            Then: {{ front | lower }}
            {% endif %}
            {% else %}
            ## {{ front }}
            {% endif %}
        - type: horizontal-stack
          cards:
            - type: gauge
              entity: sensor.casita_level_side_to_side
              name: Side to side (+ = driver high)
              min: -3
              max: 3
              needle: true
              severity:
                green: -0.5
                yellow: 0.5
                red: 1.5
            - type: gauge
              entity: sensor.casita_level_front_to_back
              name: Front to back (+ = front high)
              min: -3
              max: 3
              needle: true
              severity:
                green: -0.5
                yellow: 0.5
                red: 1.5
        - type: button
          name: Stop leveling
          icon: mdi:stop-circle-outline
          icon_height: 48px
          show_state: false
          tap_action:
            action: call-service
            service: switch.turn_off
            target:
              entity_id: switch.casita_level_leveling_mode
