# DEMO leveling view: the same screen as leveling-view.yaml, driven by
# helpers instead of the sensor, so the UI can be tried before the device
# exists. Live on the trailer HA since 2026-10-31 as view "Demo" of the
# "Leveling" sidebar dashboard (/casita-leveling).
#
# The circle, the angles and the instruction line read the SAME "last
# reading" helpers the real system uses (input_number.casita_level_last_side,
# _last_front, input_datetime.casita_level_last_check). The two sliders at
# the bottom (input_number.casita_level_demo_side / _demo_front) are copied
# into those helpers by the automation "Casita Level DEMO: feed sliders
# into last reading" (leveling-power.yaml). input_boolean.casita_level_demo_leveling
# stands in for Leveling Mode and input_boolean.casita_level_demo_moving for
# the Moving sensor.
#
# Instruction math: firmware formulas with the default geometry (track
# width 70 in, hitch to axle 130 in, tolerance 0.5 deg).
#
# Demo clean-up once the real view is in: delete this view, the four
# casita_level_demo_* helpers and the DEMO automation. The last-reading
# helpers stay.
#
# Layout: a "sections" view limited to one column, so on a wide screen the
# strip is centred instead of being spread across masonry columns.
#
# Generated by the Python in the mod 13 revision of 2026-10-31; edit the
# YAML directly if regenerating is not convenient.

title: Demo
path: demo
icon: mdi:test-tube
type: sections
max_columns: 1
sections:
- type: grid
  cards:
  - type: conditional
    conditions:
    - condition: state
      entity: input_boolean.casita_level_demo_leveling
      state: 'off'
    card:
      type: markdown
      content: 'Sensor off (low power). Last check {{ relative_time(states.input_datetime.casita_level_last_check.last_changed) }} ago: side to side **{{ states(''input_number.casita_level_last_side'') }}°**, front to back **{{ states(''input_number.casita_level_last_front'') }}°**. (Demo: the sliders at the bottom set these.)'
      grid_options:
        columns: full
    grid_options:
      columns: full
  - type: conditional
    conditions:
    - condition: state
      entity: input_boolean.casita_level_demo_leveling
      state: 'on'
    card:
      type: markdown
      content: |
        {% set s = states('input_number.casita_level_last_side') | float(0) %}
        {% set f = states('input_number.casita_level_last_front') | float(0) %}
        {% set tol = 0.5 %}
        {% set side_ok = s | abs <= tol %}
        {% set front_ok = f | abs <= tol %}
        {% set lift = ((70 * (s | abs * pi / 180) | tan) * 4) | round(0) / 4 %}
        {% set tongue = ((-130 * (f * pi / 180) | tan) * 4) | round(0) / 4 %}
        {% set side = 'Level' if side_ok else 'Raise the ' ~ ('passenger' if s > 0 else 'driver') ~ ' side ' ~ '%.2f' | format(lift) ~ ' in' %}
        {% set front = 'Level' if front_ok else ('Raise' if tongue > 0 else 'Lower') ~ ' the front ' ~ '%.2f' | format(tongue | abs) ~ ' in' %}
        {% if is_state('input_boolean.casita_level_demo_moving', 'on') %}
        ## Hold still...
        {% elif side_ok and front_ok %}
        ## Level. Chock the wheels, then lower the stabilizers.
        {% elif not side_ok %}
        ## {{ side }}
        {% if not front_ok %}
        Then: {{ front | lower }}
        {% endif %}
        {% else %}
        ## {{ front }}
        {% endif %}
      grid_options:
        columns: full
    grid_options:
      columns: full
  - type: custom:button-card
    entity: input_number.casita_level_last_side
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    triggers_update:
    - sensor.casita_level_side_to_side
    - sensor.casita_level_front_to_back
    - input_number.casita_level_last_side
    - input_number.casita_level_last_front
    - number.casita_level_level_tolerance
    - input_boolean.casita_level_demo_moving
    styles:
      grid:
      - grid-template-areas: '"bubble"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      card:
      - padding: 8px
      - box-shadow: none
      - width: 100%
      custom_fields:
        bubble:
        - justify-self: center
        - align-self: center
        - width: 100%
        - display: flex
        - justify-content: center
    custom_fields:
      bubble: |
        [[[
          // Live reading while the sensor is on, else the last saved reading.
          const pick = (liveId, lastId) => {
            const l = states[liveId];
            const v = l ? parseFloat(l.state) : NaN;
            return isFinite(v) ? v : parseFloat(states[lastId] ? states[lastId].state : 'NaN');
          };
          const s = pick('sensor.casita_level_side_to_side', 'input_number.casita_level_last_side');
          const f = pick('sensor.casita_level_front_to_back', 'input_number.casita_level_last_front');
          const tolE = states['number.casita_level_level_tolerance'];
          const tol = tolE && isFinite(parseFloat(tolE.state)) ? parseFloat(tolE.state) : 0.5;
          const mvE = states['input_boolean.casita_level_demo_moving'];
          const moving = mvE ? mvE.state === 'on' : false;
          const range = 3.0;          // degrees at the outer ring
          const R = 120, C = 150;     // ring radius, centre
          const clamp = v => Math.max(-1, Math.min(1, v));
          const ok = isFinite(s) && isFinite(f) && Math.abs(s) <= tol && Math.abs(f) <= tol;
          // + side to side = driver side high -> dot rolls to the passenger (right).
          // + front to back = front high -> dot rolls to the rear (down).
          const x = C + clamp((isFinite(s) ? s : 0) / range) * R;
          const y = C + clamp((isFinite(f) ? f : 0) / range) * R;
          const rTol = Math.max(8, tol / range * R);
          const dot = moving ? '#9e9e9e' : (ok ? '#2e7d32' : '#ef6c00');
          const txt = 'var(--primary-text-color)';
          return `
            <svg viewBox="0 0 300 300" width="100%" style="max-width:300px;height:auto;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">
              <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${txt}" stroke-width="2" opacity="0.6"/>
              <circle cx="${C}" cy="${C}" r="${R * 2 / 3}" fill="none" stroke="${txt}" stroke-width="1" opacity="0.25"/>
              <circle cx="${C}" cy="${C}" r="${R / 3}" fill="none" stroke="${txt}" stroke-width="1" opacity="0.25"/>
              <circle cx="${C}" cy="${C}" r="${rTol}" fill="${ok ? '#2e7d32' : 'none'}" fill-opacity="0.15" stroke="#2e7d32" stroke-width="2"/>
              <line x1="${C - R}" y1="${C}" x2="${C + R}" y2="${C}" stroke="${txt}" stroke-width="1" opacity="0.3"/>
              <line x1="${C}" y1="${C - R}" x2="${C}" y2="${C + R}" stroke="${txt}" stroke-width="1" opacity="0.3"/>
              <text x="${C}" y="18" text-anchor="middle" font-size="13" fill="${txt}">FRONT</text>
              <text x="${C}" y="294" text-anchor="middle" font-size="13" fill="${txt}">REAR</text>
              <text x="14" y="${C + 4}" text-anchor="middle" font-size="13" fill="${txt}" transform="rotate(-90 14 ${C})">DRIVER</text>
              <text x="286" y="${C + 4}" text-anchor="middle" font-size="13" fill="${txt}" transform="rotate(90 286 ${C})">PASSENGER</text>
              <circle cx="${x}" cy="${y}" r="14" fill="${dot}" stroke="white" stroke-width="2"/>
            </svg>`;
        ]]]
    extra_styles: |
      :host { display: block !important; width: 100% !important; }
      ha-card { width: 100% !important; box-sizing: border-box; }
      #container { width: 100%; justify-items: center; }
      #bubble { width: 100%; display: flex; justify-content: center; }
    grid_options:
      columns: full
  - type: glance
    columns: 2
    entities:
    - entity: input_number.casita_level_last_side
      name: Side to side
    - entity: input_number.casita_level_last_front
      name: Front to back
    grid_options:
      columns: full
  - type: conditional
    conditions:
    - condition: state
      entity: input_boolean.casita_level_demo_leveling
      state: 'off'
    card:
      type: button
      name: Start leveling
      icon: mdi:spirit-level
      icon_height: 80px
      show_state: false
      tap_action:
        action: call-service
        service: input_boolean.turn_on
        target:
          entity_id: input_boolean.casita_level_demo_leveling
      grid_options:
        columns: full
    grid_options:
      columns: full
  - type: conditional
    conditions:
    - condition: state
      entity: input_boolean.casita_level_demo_leveling
      state: 'on'
    card:
      type: button
      name: Stop leveling
      icon: mdi:stop-circle-outline
      icon_height: 48px
      show_state: false
      tap_action:
        action: call-service
        service: input_boolean.turn_off
        target:
          entity_id: input_boolean.casita_level_demo_leveling
      grid_options:
        columns: full
    grid_options:
      columns: full
  - type: entities
    title: Pretend the trailer is tilted
    entities:
    - entity: input_number.casita_level_demo_side
      name: Side to side (+ = driver side high)
    - entity: input_number.casita_level_demo_front
      name: Front to back (+ = front high)
    - entity: input_boolean.casita_level_demo_moving
      name: Moving
    grid_options:
      columns: full
